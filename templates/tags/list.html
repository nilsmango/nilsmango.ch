{% extends "index.html" %}

{% block title %}Tags - {{ config.title }}{% endblock title%}

{% block content %}
<h1 class="title">Tags</h1>
<p>→ View all <a href="/blog">articles</a> or all <a href="/live">live sessions</a></p>
<p></p>
<ul class="posts">
    {% for term in terms %}
    <li class="nobullets"><h3>
        <a href="{{ term.permalink }}">
        #{{ term.name }}</a> ({{ term.pages | length }})
    </h3></li>
    {% endfor %}
</ul>
{% endblock content %}
